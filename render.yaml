# Render blueprint: New > Blueprint, pick this repo, then fill in the two secrets.
services:
  - type: web
    name: invoice-exception-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL      # any Postgres connection string
        sync: false
      - key: GOOGLE_API_KEY    # from aistudio.google.com/apikey
        sync: false
